name: Publish @baobox/skill-builder-contract

# Tag-driven release: push a `contract-v0.1.0` tag → npm publish fires for the
# contract workspace. Mirrors @baobox/sdk's publish flow (per-package tag prefix
# so each package in the monorepo releases independently).
on:
  push:
    tags: ["contract-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm run typecheck --workspace @baobox/skill-builder-contract
      - run: npm test --workspace @baobox/skill-builder-contract
      - run: npm run build --workspace @baobox/skill-builder-contract
      - name: npm publish
        run: npm publish --provenance --access public --workspace @baobox/skill-builder-contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
