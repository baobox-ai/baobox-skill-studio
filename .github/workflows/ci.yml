name: CI

# Verify every workspace on push to main and on PRs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm install
      # Build first: packages depend on each other's emitted .d.ts (the BFF and
      # web component resolve @baobox/skill-builder-contract's types from its
      # dist), and the root `build` builds the contract before its dependents.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
